[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omniroute-sdk"
version = "0.0.0"
description = "Experimental, unpublished OmniRoute API client (standard library only)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Private :: Do Not Upload",
]

[tool.setuptools]
packages = ["omniroute_sdk"]
