name: opencode-plugin CI

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "@omniroute/opencode-plugin/**"
      - "@omniroute/opencode-plugin-v2/**"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "@omniroute/opencode-plugin/**"
      - "@omniroute/opencode-plugin-v2/**"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: "@omniroute/opencode-plugin"

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: "@omniroute/opencode-plugin/package-lock.json"
      # Mirrors the publish job's install exactly (`ci --ignore-scripts`). If
      # skipping dependency scripts ever breaks the build, it breaks HERE, on a PR,
      # instead of inside the job that holds the provenance token.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

  test-v2:
    name: Test v2 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: "@omniroute/opencode-plugin-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: "@omniroute/opencode-plugin-v2/package-lock.json"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, test-v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Build plugin-v2 artifact
        working-directory: "@omniroute/opencode-plugin-v2"
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opencode-plugin-v2-dist
          path: "@omniroute/opencode-plugin-v2/dist"
          retention-days: 7
